<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Home Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);

overflow:hidden;

}

body::before{

content:"";

position:absolute;

width:500px;

height:500px;

background:#3b82f6;

border-radius:50%;

filter:blur(170px);

top:-120px;

left:-120px;

opacity:.4;

animation:move1 8s infinite alternate;

}

body::after{

content:"";

position:absolute;

width:500px;

height:500px;

background:#9333ea;

border-radius:50%;

filter:blur(170px);

bottom:-120px;

right:-120px;

opacity:.4;

animation:move2 8s infinite alternate;

}

@keyframes move1{

from{transform:translate(0,0);}
to{transform:translate(120px,80px);}

}

@keyframes move2{

from{transform:translate(0,0);}
to{transform:translate(-120px,-80px);}

}

.login-box{

width:420px;

background:rgba(255,255,255,.12);

backdrop-filter:blur(25px);

padding:40px;

border-radius:25px;

box-shadow:0 15px 50px rgba(0,0,0,.4);

color:white;

z-index:10;

animation:fade .8s;

}

@keyframes fade{

from{

opacity:0;

transform:translateY(40px);

}

to{

opacity:1;

transform:translateY(0);

}

}

h1{

text-align:center;

margin-bottom:10px;

}

.subtitle{

text-align:center;

opacity:.8;

margin-bottom:35px;

}

.input-box{

margin-bottom:20px;

}

.input-box input{

width:100%;

padding:15px;

border:none;

outline:none;

border-radius:12px;

font-size:16px;

}

button{

width:100%;

padding:15px;

border:none;

border-radius:12px;

background:#2563eb;

color:white;

font-size:17px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

button:hover{

background:#1d4ed8;

transform:translateY(-2px);

}

.error{

background:#dc2626;

padding:10px;

border-radius:10px;

margin-bottom:20px;

text-align:center;

}

.register{

margin-top:20px;

text-align:center;

}

.register a{

color:#93c5fd;

text-decoration:none;

font-weight:bold;

}

</style>

</head>

<body>

<div class="login-box">

<h1>🏠 Smart Home</h1>

<p class="subtitle">

Login to control your devices

</p>

{% if error %}

<div class="error">

{{ error }}

</div>

{% endif %}

<form method="POST">

<div class="input-box">

<input
type="text"
name="username"
placeholder="Username"
required>

</div>

<div class="input-box">

<input
type="password"
name="password"
placeholder="Password"
required>

</div>

<button type="submit">

Login

</button>

</form>

<div class="register">

Don't have an account?

<a href="/register">

Register

</a>

</div>

</div>

</body>

</html>
