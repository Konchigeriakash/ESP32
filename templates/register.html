<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);

overflow:hidden;

}

body::before{

content:"";

position:absolute;

width:450px;

height:450px;

background:#2563eb;

border-radius:50%;

filter:blur(160px);

top:-120px;

left:-120px;

opacity:.35;

}

body::after{

content:"";

position:absolute;

width:450px;

height:450px;

background:#9333ea;

border-radius:50%;

filter:blur(160px);

bottom:-120px;

right:-120px;

opacity:.35;

}

.register-box{

width:430px;

background:rgba(255,255,255,.12);

backdrop-filter:blur(25px);

padding:40px;

border-radius:25px;

color:white;

box-shadow:0 20px 45px rgba(0,0,0,.35);

z-index:10;

}

h1{

text-align:center;

margin-bottom:10px;

}

.subtitle{

text-align:center;

opacity:.8;

margin-bottom:30px;

}

.input-box{

margin-bottom:20px;

}

.input-box input{

width:100%;

padding:15px;

border:none;

outline:none;

border-radius:12px;

font-size:16px;

}

button{

width:100%;

padding:15px;

border:none;

border-radius:12px;

background:#2563eb;

color:white;

font-size:17px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

button:hover{

background:#1d4ed8;

transform:translateY(-2px);

}

.error{

background:#dc2626;

padding:10px;

border-radius:10px;

margin-bottom:20px;

text-align:center;

}

.login{

margin-top:20px;

text-align:center;

}

.login a{

color:#93c5fd;

text-decoration:none;

font-weight:bold;

}

</style>

</head>

<body>

<div class="register-box">

<h1>📝 Create Account</h1>

<p class="subtitle">

Register for Smart Home

</p>

{% if error %}

<div class="error">

{{ error }}

</div>

{% endif %}

<form method="POST">

<div class="input-box">

<input
type="text"
name="username"
placeholder="Username"
required>

</div>

<div class="input-box">

<input
type="password"
name="password"
placeholder="Password"
required>

</div>

<button type="submit">

Register

</button>

</form>

<div class="login">

Already have an account?

<a href="/login">

Login

</a>

</div>

</div>

</body>

</html>
